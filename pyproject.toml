[project]
name = "taxi-demand"
version = "0.1.0"
description = "Production-style MLOps platform for hourly NYC taxi demand forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # core: needed everywhere, including the slim serving image
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "holidays>=0.50",
    "lightgbm>=4.3",
]

[dependency-groups]
pipeline = ["duckdb>=1.0", "pandera>=0.24", "requests>=2.31", "scikit-learn>=1.4", "mlflow>=2.14", "prefect>=3.0"]
serve = ["fastapi>=0.115,<0.120", "uvicorn[standard]>=0.29"]
analysis = ["jupyterlab>=4", "matplotlib>=3.8", "nbclient>=0.10", "ipykernel>=6"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.7", "httpx>=0.27"]

[tool.uv]
default-groups = ["pipeline", "serve", "analysis", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_demand"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # third-party deprecations we don't control
    "ignore:.*httpx2.*",
    "ignore:.*noload.*",
    "ignore:.*BlockingPortal.*",
    "ignore:.*OperatorClass.*",
]
